name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run core unit tests
        run: gradle --stacktrace :core:testDebugUnitTest

      - name: Run core Android lint
        run: gradle --stacktrace :core:lintDebug

  rust-prediction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Test Rust prediction core
        run: cargo test --manifest-path converter-rust/Cargo.toml

  swift-converter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Test converter wrapper
        run: swift test --package-path converter-swift

      - name: Test Rust prediction core against Swift baseline dictionary
        shell: bash
        run: |
          set -euo pipefail
          char_id_path="$(find converter-swift/.build -type f \
            -path '*/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary/louds/charID.chid' \
            -print -quit)"
          test -n "$char_id_path"
          dictionary_path="${char_id_path%/louds/charID.chid}"
          dictionary_path="$(realpath "$dictionary_path")"
          test -f "$dictionary_path/louds/charID.chid"
          AZOOKEY_DICTIONARY_PATH="$dictionary_path" \
            timeout 60s cargo test --manifest-path converter-rust/Cargo.toml \
              tests::pinned_dictionary_matches_upstream_must_word_when_available -- --exact

          for input in "あ" "あさ"; do
            swift_output="$(swift run --package-path converter-swift AzooKeyPredictionOracle "$input" 2>&1)"
            swift_json="$(printf '%s\n' "$swift_output" \
              | sed -n 's/^AZOOKEY_PREDICTION_JSON=//p' \
              | tail -n 1)"
            test -n "$swift_json"

            rust_json="$(cargo run --quiet \
              --manifest-path converter-rust/Cargo.toml \
              --bin prediction_oracle -- \
              "$dictionary_path" "$input" 5)"

            python3 -c 'import json,sys; i,s,r=sys.argv[1:4]; a=json.loads(s); b=json.loads(r)[:3]; assert b == a, f"prediction parity mismatch for {i!r}: swift={a!r} rust={b!r}"' "$input" "$swift_json" "$rust_json"
          done

          for input in "あ" "あさ" "わたしは"; do
            swift_output="$(swift run --package-path converter-swift AzooKeyPredictionOracle "$input" 2>&1)"
            auto_mix_json="$(printf '%s\n' "$swift_output" \
              | sed -n 's/^AZOOKEY_AUTO_MIX_JSON=//p' \
              | tail -n 1)"
            bridge_json="$(printf '%s\n' "$swift_output" \
              | sed -n 's/^AZOOKEY_CONVERSION_BRIDGE_JSON=//p' \
              | tail -n 1)"
            test -n "$auto_mix_json"
            test -n "$bridge_json"

            path_json="$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["path"], ensure_ascii=False, separators=(",",":")))' "$bridge_json")"
            rust_scored_json="$(cargo run --quiet \
              --manifest-path converter-rust/Cargo.toml \
              --bin prediction_path_scored_oracle -- \
              "$dictionary_path" "$path_json" 3)"

            python3 scripts/check_prediction_merge.py \
              "$input" "$auto_mix_json" "$bridge_json" "$rust_scored_json"
          done

          for input in "わたしは"; do
            swift_output="$(swift run --package-path converter-swift AzooKeyPredictionOracle "$input" 2>&1)"
            diagnostics_json="$(printf '%s\n' "$swift_output" \
              | sed -n 's/^AZOOKEY_PREDICTION_DIAGNOSTICS_JSON=//p' \
              | tail -n 1)"
            test -n "$diagnostics_json"

            path_json="$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["path"], ensure_ascii=False, separators=(",",":")))' "$diagnostics_json")"
            rust_json="$(cargo run --quiet \
              --manifest-path converter-rust/Cargo.toml \
              --bin prediction_path_oracle -- \
              "$dictionary_path" "$path_json" 3)"

            python3 -c 'import json,sys; i,d,r=sys.argv[1:4]; expected=json.loads(d)["predictions"]; actual=json.loads(r); assert actual == expected, f"path prediction parity mismatch for {i!r}: swift={expected!r} rust={actual!r}"' "$input" "$diagnostics_json" "$rust_json"
          done

  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NDK_VERSION: r30
      REQUESTED_SWIFT_VERSION: "6.4"
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 for swift-java publishing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install swiftly
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get -yq install curl jq gpg unzip libcurl4-openssl-dev
          ARCH="$(uname -m)"
          curl -L -O --retry 3 "https://download.swift.org/swiftly/linux/swiftly-${ARCH}.tar.gz"
          tar -xzf "swiftly-${ARCH}.tar.gz"
          ./swiftly init \
            --assume-yes \
            --skip-install \
            --no-modify-profile \
            --quiet-shell-followup
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o ndk.zip --retry 3 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Resolve Swift Android SDK
        id: swift-sdk
        shell: bash
        run: |
          set -euxo pipefail
          releases_json="$(curl -fsSL https://www.swift.org/api/v1/install/releases.json)"
          latest_version="$(echo "$releases_json" | jq -r --arg v "$REQUESTED_SWIFT_VERSION" \
            '[.[] | select(.name | startswith($v))]
             | sort_by(.name | split(".") | map(tonumber? // 0))
             | last
             | .name')"
          test -n "$latest_version"
          test "$latest_version" != "null"

          checksum="$(echo "$releases_json" | jq -r --arg v "$latest_version" \
            '.[] | select(.name == $v)
             | .platforms[]
             | select(.platform == "android-sdk")
             | .checksum')"

          tag="swift-${latest_version}-RELEASE"
          url="https://download.swift.org/swift-${latest_version}-release/android-sdk/${tag}/${tag}_android.artifactbundle.tar.gz"

          echo "version=$latest_version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "SWIFT_VERSION=$latest_version" >> "$GITHUB_ENV"
          echo "SWIFT_ANDROID_SDK_VERSION=${tag#swift-}_android" >> "$GITHUB_ENV"

      - name: Install Swift toolchain and Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          swiftly install "${{ steps.swift-sdk.outputs.version }}"
          swift sdk install \
            "${{ steps.swift-sdk.outputs.url }}" \
            --checksum "${{ steps.swift-sdk.outputs.checksum }}"
          swift --version
          swift sdk list

      - name: Configure Swift Android SDK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(
            "$HOME"/.swiftpm/swift-sdks/*android*.artifactbundle
            "$HOME"/.config/swiftpm/swift-sdks/*android*.artifactbundle
            "$HOME"/Library/org.swift.swiftpm/swift-sdks/*android*.artifactbundle
          )
          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo "No Android Swift SDK artifactbundle found" >&2
            exit 1
          fi
          cd "${candidates[0]}"
          ./swift-android/scripts/setup-android-sdk.sh

      - name: Resolve Swift packages
        working-directory: converter-swift
        run: swift package resolve

      - name: Publish SwiftKit Core to Maven local
        working-directory: converter-swift
        run: |
          ./.build/checkouts/swift-java/gradlew \
            --project-dir .build/checkouts/swift-java \
            :SwiftKitCore:publishToMavenLocal

      - name: Set up JDK 17 for Android Gradle Plugin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run app tests, lint, and Android build
        run: |
          gradle --stacktrace \
            :converter-swift:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify packaged converter and APK
        shell: bash
        run: |
          set -euxo pipefail
          aar="converter-swift/build/outputs/aar/converter-swift-debug.aar"
          apk="app/build/outputs/apk/debug/app-debug.apk"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aar" | grep -q "jni/$abi/libAzooKeyAndroidJNI.so"
            unzip -l "$aar" | grep -q "jni/$abi/libSwiftJava.so"
            unzip -l "$apk" | grep -q "lib/$abi/libAzooKeyAndroidJNI.so"
            unzip -l "$apk" | grep -q "lib/$abi/libazookey_prediction_rust.so"
          done

          unzip -p "$aar" classes.jar > "$RUNNER_TEMP/converter-classes.jar"
          jar tf "$RUNNER_TEMP/converter-classes.jar" \
            | grep -qx 'dev/turboboo/azookey/converter/AzooKeyAndroidJNI.class'

          rust_so="app/build/generated/rustJniLibs/x86_64/libazookey_prediction_rust.so"
          test -f "$rust_so"
          nm -D "$rust_so" \
            | grep -q 'Java_dev_turboboo_azookey_ime_RustPredictionBridge_prefixWordsJson'
          nm -D "$rust_so" \
            | grep -q 'Java_dev_turboboo_azookey_ime_RustPredictionBridge_prefixWordsWithContextJson'
          nm -D "$rust_so" \
            | grep -q 'Java_dev_turboboo_azookey_ime_RustPredictionBridge_prefixWordsFromPathJson'
          nm -D "$rust_so" \
            | grep -q 'Java_dev_turboboo_azookey_ime_RustPredictionBridge_prefixScoredFromPathJson'

          unzip -l "$aar" | grep -q 'assets/azookey_dictionary/'
          unzip -l "$apk" | grep -q 'assets/azookey_dictionary/'
          unzip -p "$aar" assets/third_party/azooKey_dictionary_storage-LICENSE.txt \
            | grep -q 'Apache License'
          unzip -p "$apk" assets/third_party/azooKey_dictionary_storage-LICENSE.txt \
            | grep -q 'Apache License'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: azookey-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Swift Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: azookey-converter-swift-debug
          path: converter-swift/build/outputs/aar/converter-swift-debug.aar
          if-no-files-found: error
